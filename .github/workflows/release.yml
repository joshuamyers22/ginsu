name: Build release artifacts

# Publication remains intentionally disabled until Ginsu has trusted-publishing
# environments, an approved release policy, and complete release evidence.
on:
  workflow_dispatch:

jobs:
  build:
    name: Build and retain distributions
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install build frontend
        run: python -m pip install build
      - name: Build wheel and source distribution
        run: python -m build
      - name: Store distributions
        uses: actions/upload-artifact@v7
        with:
          name: ginsu-distributions
          path: dist/
