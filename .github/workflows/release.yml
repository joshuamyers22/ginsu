name: Build release candidate

# This workflow never publishes. PyPI and GitHub Release publication remain
# blocked pending explicit owner approval and trusted-publisher configuration.
on:
  workflow_dispatch:
    inputs:
      expected_version:
        description: Version expected in pyproject.toml
        required: true
        default: "0.1.0"
        type: string
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

concurrency:
  group: release-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Gate and build once
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install locked quality dependencies
        run: uv sync --frozen --all-extras
      - name: Validate source release identity
        id: release
        shell: bash
        env:
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          set -euo pipefail
          version="$(uv run --frozen python scripts/release_tools.py version)"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          uv run --frozen python scripts/release_tools.py validate-source \
            --expected-version "${EXPECTED_VERSION}" \
            --ref "${GITHUB_REF}"
      - name: Run complete quality gate
        run: |
          make check
          make test
          make execute-notebooks
      - name: Build source and wheel distributions once
        run: uv build --clear
      - name: Inspect distribution metadata and contents
        run: >-
          uv run --frozen python scripts/release_tools.py validate-dist
          --directory dist
      - name: Generate locked CycloneDX SBOM
        run: >-
          uv export --quiet --preview-features sbom-export
          --format cyclonedx1.5 --frozen --all-extras --no-emit-project
          --output-file
          "dist/ginsu-${{ steps.release.outputs.version }}.cdx.json"
      - name: Record candidate provenance and checksums
        run: |
          uv run --frozen python scripts/release_tools.py write-provenance \
            --directory dist
          uv run --frozen python scripts/release_tools.py write-checksums \
            --directory dist
          uv run --frozen python scripts/release_tools.py verify-checksums \
            --directory dist
      - name: Store immutable candidate bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ginsu-${{ steps.release.outputs.version }}-candidate
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
          include-hidden-files: false

  smoke:
    name: ${{ matrix.label }}
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu Python 3.10 core wheel
            runner: ubuntu-latest
            python: "3.10"
            format: wheel
            sync_args: ""
            profile: core
          - label: Ubuntu Python 3.11 core wheel
            runner: ubuntu-latest
            python: "3.11"
            format: wheel
            sync_args: ""
            profile: core
          - label: Ubuntu Python 3.12 core wheel
            runner: ubuntu-latest
            python: "3.12"
            format: wheel
            sync_args: ""
            profile: core
          - label: macOS Python 3.10 core wheel
            runner: macos-latest
            python: "3.10"
            format: wheel
            sync_args: ""
            profile: core
          - label: macOS Python 3.11 core wheel
            runner: macos-latest
            python: "3.11"
            format: wheel
            sync_args: ""
            profile: core
          - label: macOS Python 3.12 core wheel
            runner: macos-latest
            python: "3.12"
            format: wheel
            sync_args: ""
            profile: core
          - label: Windows Python 3.10 core wheel
            runner: windows-latest
            python: "3.10"
            format: wheel
            sync_args: ""
            profile: core
          - label: Windows Python 3.11 core wheel
            runner: windows-latest
            python: "3.11"
            format: wheel
            sync_args: ""
            profile: core
          - label: Windows Python 3.12 core wheel
            runner: windows-latest
            python: "3.12"
            format: wheel
            sync_args: ""
            profile: core
          - label: Ubuntu Python 3.10 optimized wheel
            runner: ubuntu-latest
            python: "3.10"
            format: wheel
            sync_args: "--extra optimized"
            profile: optimized
          - label: Ubuntu Python 3.11 optimized wheel
            runner: ubuntu-latest
            python: "3.11"
            format: wheel
            sync_args: "--extra optimized"
            profile: optimized
          - label: Ubuntu Python 3.12 optimized wheel
            runner: ubuntu-latest
            python: "3.12"
            format: wheel
            sync_args: "--extra optimized"
            profile: optimized
          - label: Ubuntu Python 3.12 compatibility wheel
            runner: ubuntu-latest
            python: "3.12"
            format: wheel
            sync_args: "--extra compat"
            profile: compat
          - label: Ubuntu Python 3.12 plotting wheel
            runner: ubuntu-latest
            python: "3.12"
            format: wheel
            sync_args: "--extra plot"
            profile: plot
          - label: Ubuntu Python 3.12 core sdist
            runner: ubuntu-latest
            python: "3.12"
            format: sdist
            sync_args: ""
            profile: core
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Download candidate built by gate
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ginsu-${{ needs.build.outputs.version }}-candidate
          path: candidate
      - name: Verify candidate checksums
        run: >-
          python scripts/release_tools.py verify-checksums
          --directory candidate
      - name: Create locked smoke environment
        run: >-
          uv sync --frozen --no-install-project ${{ matrix.sync_args }}
      - name: Install wheel without dependency re-resolution
        if: matrix.format == 'wheel'
        run: >-
          uv pip install --python .venv --no-deps
          "candidate/ginsu-${{ needs.build.outputs.version }}-py3-none-any.whl"
      - name: Install source distribution
        if: matrix.format == 'sdist'
        run: >-
          uv pip install --python .venv --no-deps
          "candidate/ginsu-${{ needs.build.outputs.version }}.tar.gz"
      - name: Smoke-test installed candidate
        run: >-
          uv run --frozen --no-sync python -I scripts/smoke_release.py
          --profile "${{ matrix.profile }}"
          --expected-version "${{ needs.build.outputs.version }}"
