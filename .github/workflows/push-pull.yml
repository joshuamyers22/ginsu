name: Test

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        numba: [true, false]
    name: Python ${{ matrix.python-version }} (Numba=${{ matrix.numba }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Install core and development dependencies
        if: ${{ !matrix.numba }}
        run: uv sync --frozen --extra dev --extra compat --extra plot
      - name: Install optimized dependencies
        if: matrix.numba
        run: >-
          uv sync --frozen --extra dev --extra compat --extra optimized
          --extra plot
      - name: Verify Numba availability
        env:
          EXPECTED_NUMBA: ${{ matrix.numba }}
        run: >-
          uv run --frozen python -c
          "import os; from ginsu import is_numba_available;
          actual = is_numba_available();
          expected = os.environ['EXPECTED_NUMBA'] == 'true';
          assert actual == expected, (actual, expected)"
      - name: Run quality gate
        run: make check
      - name: Measure coverage
        if: matrix.python-version == '3.12' && matrix.numba
        run: make test

  core-wheel:
    name: Core-only wheel smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Build and install wheel
        run: |
          uv build
          uv venv .wheel-venv
          uv pip install --python .wheel-venv/bin/python dist/*.whl
      - name: Verify core-only Polars operation and package boundary
        run: >-
          .wheel-venv/bin/python -I -c
          "import importlib.util; import polars as pl;
          from ginsu import Slicefinder;
          X = pl.DataFrame({'region': ['east', 'east', 'west', 'west']});
          finder = Slicefinder(alpha=.95, min_sup=1, verbose=False).fit(
          X, [4., 3., 1., 1.]);
          assert finder.slices_.height;
          assert importlib.util.find_spec('pandas') is None;
          assert importlib.util.find_spec('plotly') is None;
          assert importlib.util.find_spec('sliceline') is None"

  notebooks:
    name: Offline Polars notebook smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
      - name: Verify compatibility libraries are absent
        run: >-
          uv run --frozen --extra notebooks --extra plot python -c
          "import importlib.util;
          assert importlib.util.find_spec('pandas') is None;
          assert importlib.util.find_spec('pyarrow') is None"
      - name: Execute offline notebooks
        run: make execute-notebooks
