name: Test built distributions

on:
  workflow_dispatch:

jobs:
  smoke-test:
    name: Build and test installation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build distribution
        run: |
          python -m pip install build
          python -m build
      - name: Install wheel
        run: python -m pip install dist/*.whl
      - name: Verify independent import
        run: python -I -c "import ginsu; print(ginsu.__name__)"
