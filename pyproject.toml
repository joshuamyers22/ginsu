[project]
name = "ginsu"
version = "0.1.0"
description = "Fast slice finding for Machine Learning model debugging."
readme = "README.rst"
license = "BSD-3-Clause"
keywords = ["machine-learning", "model-debugging", "polars", "slice-finding"]
authors = [
    { name = "Ginsu contributors" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.25,<3",
    "polars>=1.30,<2",
    "scikit-learn>=1.6.0,<2",
    "scipy>=1.12,<2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/joshuamyers22/ginsu"
Repository = "https://github.com/joshuamyers22/ginsu"
Issues = "https://github.com/joshuamyers22/ginsu/issues"
Upstream = "https://github.com/DataDome/sliceline"

[project.optional-dependencies]
dev = [
    "hatchling==1.32.0",
    "mypy>=1.15,<2",
    "pytest>=7.2.0",
    "pytest-benchmark>=4.0.0",
    "pytest-cov>=3.0.0",
    "ruff>=0.9.0",
    "Sphinx>=8.0.0",
    "sphinx-rtd-theme>=3.0.0",
    "tomli>=2.2; python_version < '3.11'",
]
compat = [
    "pandas>=2.1.1",
    "pyarrow>=16",
]
notebooks = [
    "jupyter>=1.0.0",
    "nbconvert>=7.0.0",
]
optimized = [
    "numba>=0.60.0",
]
plot = [
    "plotly>=6,<7",
]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ginsu"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/.github",
    "/.pre-commit-config.yaml",
    "/.readthedocs.yml",
    "/AGENTS.md",
    "/CLAUDE.md",
    "/PROJECT_MEMORY.md",
    "/docs/POLARS_VISUALIZATION_PRODUCTION_PLAN.md",
    "/docs/PROJECT_BRIEF.md",
    "/docs/project_notes",
]

[tool.ruff]
line-length = 79
target-version = "py310"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
]

[tool.ruff.lint.isort]
known-first-party = ["ginsu"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
files = ["ginsu"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.coverage.run]
omit = [".*", "*/site-packages/*", "tests/*"]

[tool.coverage.report]
fail_under = 80

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not performance"]
markers = [
    "performance: timing and resource regression tests",
]
